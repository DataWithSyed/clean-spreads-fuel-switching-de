# Clean spark / clean dark spreads and the coal-to-gas fuel-switching CO2 price (Germany, DE-LU)
# Source tags: IPCC2006 = IPCC 2006 Guidelines default · DEHSt = German auction results (EEX/DEHSt)
#              WB = World Bank Pink Sheet definition · ILLUSTRATIVE = author assumption

period:
  start: "2019-01-01"          # first day (Europe/Berlin)
  end: "2026-09-30"            # last day with World Bank monthly fuel prices (Pink Sheet, Oct 2026 release)

market:
  bidding_zone: "DE-LU"        # Energy-Charts day-ahead price
  country: "de"                # Energy-Charts public net generation

gas_plant:                     # combined-cycle gas turbine (CCGT)
  efficiency: 0.50             # ILLUSTRATIVE: fleet-average CCGT, LHV-ish net
  efficiency_low: 0.45         # ILLUSTRATIVE: older CCGT (switching band)
  efficiency_high: 0.58        # ILLUSTRATIVE: new H-class CCGT (switching band)
  emission_factor_t_per_mwh_th: 0.20196   # IPCC2006 Vol.2 Tab.2.2: natural gas 56.1 kgCO2/GJ x 3.6
  vom_eur_per_mwh_e: 2.5       # ILLUSTRATIVE variable O&M
  hub_to_plant_eur_per_mwh_th: 0.0   # ILLUSTRATIVE: TTF taken as delivered cost

coal_plant:                    # hard-coal steam plant
  efficiency: 0.38             # ILLUSTRATIVE: fleet-average hard-coal unit
  efficiency_low: 0.35         # ILLUSTRATIVE: old unit (switching band)
  efficiency_high: 0.45        # ILLUSTRATIVE: modern supercritical unit (switching band)
  emission_factor_t_per_mwh_th: 0.34056   # IPCC2006 Vol.2 Tab.2.2: other bituminous coal 94.6 kgCO2/GJ x 3.6
  calorific_kcal_per_kg: 6000  # WB: Richards Bay coal is NAR 6,000 kcal/kg
  freight_usd_per_t: 12.0      # ILLUSTRATIVE: FOB Richards Bay -> ARA -> plant (freight + handling)
  vom_eur_per_mwh_e: 4.0       # ILLUSTRATIVE variable O&M

# Annual volume-weighted average EUA auction price for Germany (EUR/tCO2), DEHSt "Versteigerungsergebnisse seit 2012"
# (source: EEX, DEHSt) and DEHSt quarterly auction reports 2026 Q1/Q2 (H1 2026 VWAP 76.02).
# 2026 Q3 has no published DEHSt figure yet: the H1 2026 value is carried forward (flagged in outputs).
eua_eur_per_t:
  2019: 24.66
  2020: 24.59
  2021: 52.47
  2022: 80.40
  2023: 83.68
  2024: 65.01
  2025: 73.86
  2026: 76.02

analysis:
  eua_sweep_max: 150           # EUR/t, for the sensitivity curve
  eua_sweep_step: 1

# Dispatch-constrained valuation of a 1 MW unit (src/spreads/dispatch.py). All ILLUSTRATIVE, except the start
# wear-and-tear costs, which are the median WARM-start capital & maintenance costs (lower bound) from
# Kumar et al. (2012), "Power Plant Cycling Costs", NREL/SR-5500-55433, Table 1-1 (2011 USD per MW, used here
# as EUR per MW without inflation or FX adjustment, i.e. an order-of-magnitude value; see the sensitivity).
dispatch:
  gas:
    min_stable_generation: 0.45     # ILLUSTRATIVE share of capacity
    part_load_efficiency_drop: 0.06 # ILLUSTRATIVE: 50 % at full load -> 44 % at min stable generation
    min_up_h: 4                     # ILLUSTRATIVE
    min_down_h: 4                   # ILLUSTRATIVE
    start_cost_cm_eur_per_mw: 55    # Kumar et al. 2012, gas CC warm start, median lower bound ($55/MW)
    start_fuel_mwh_th_per_mw: 1.5   # ILLUSTRATIVE start-up fuel (priced at TTF + CO2)
  coal:
    min_stable_generation: 0.40     # ILLUSTRATIVE
    part_load_efficiency_drop: 0.04 # ILLUSTRATIVE: 38 % -> 34 %
    min_up_h: 8                     # ILLUSTRATIVE
    min_down_h: 8                   # ILLUSTRATIVE
    start_cost_cm_eur_per_mw: 65    # Kumar et al. 2012, large sub-critical coal warm start, median lower bound ($65/MW)
    start_fuel_mwh_th_per_mw: 4.0   # ILLUSTRATIVE start-up fuel (priced at delivered coal + CO2)
  start_cost_sensitivity: [0.0, 0.5, 1.0, 2.0, 4.0]
